; ==============================================================================
; Asterisk Dialplan Configuration for Gujarati Doctor Appointment IVR
; ==============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
FASTAGI_SERVER=agi://127.0.0.1:4573/ivr

; ------------------------------------------------------------------------------
; Context for Inbound Calls from SIP Trunk / DID
; ------------------------------------------------------------------------------
[from-trunk]
exten => s,1,NoOp(--- Incoming IVR Call to Gujarati Doctor Appointment System ---)
 same => n,Set(CHANNEL(language)=gu)
 same => n,Answer()
 same => n,Wait(1)
 ; Route call to Python FastAGI server
 same => n,AGI(${FASTAGI_SERVER})
 same => n,NoOp(--- FastAGI Session Completed ---)
 same => n,Hangup()

; Match any incoming dialed number (DID) and redirect to main IVR extension
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

; Hangup extension handler
exten => h,1,NoOp(Call hung up by user or system)
 same => n,Hangup()

; ------------------------------------------------------------------------------
; Context for Internal Test Extensions (Softphones like MicroSIP / Zoiper)
; ------------------------------------------------------------------------------
[from-internal]
; Dial extension 1000 to test the Gujarati IVR flow
exten => 1000,1,NoOp(Internal Test Call to Gujarati IVR)
 same => n,Goto(from-trunk,s,1)

; Dial extension 100 to test the Gujarati IVR flow
exten => 100,1,NoOp(Internal Test Call to Gujarati IVR Ext 100)
 same => n,Goto(from-trunk,s,1)

; Automated Call Tester Extension (Dr. Jaydeep Patel - Option 2)
exten => 9999,1,NoOp(--- Automated Call Tester Dr. Jaydeep ---)
 same => n,Answer()
 same => n,Wait(2)
 same => n,SendDTMF(2)
 same => n,Wait(3)
 same => n,SendDTMF(1)
 same => n,Wait(3)
 same => n,SendDTMF(9123456780#)
 same => n,Wait(3)
 same => n,SendDTMF(1)
 same => n,Wait(4)
 same => n,Playback(/var/lib/asterisk/sounds/ivr/gu/tts_0f6a8ecb87792ccff4c8a0e804c3a411)
 same => n,SendDTMF(#)
 same => n,Wait(7)
 same => n,SendDTMF(1)
 same => n,Wait(6)
 same => n,SendDTMF(1)
 same => n,Wait(20)
 same => n,Hangup()

; Match any other dialed number and route to IVR
exten => _X.,1,NoOp(Internal Test Call Match-All)
 same => n,Goto(from-trunk,s,1)

; Dial extension 1001 to test with fallback standard AGI script directly
exten => 1001,1,NoOp(Internal Test Call via Standard AGI Script)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(/var/lib/asterisk/agi-bin/ivr_handler.py)
 same => n,Hangup()
