; ==============================================================================
; Asterisk PJSIP Configuration for Softphones and Inbound SIP Trunks
; ==============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ------------------------------------------------------------------------------
; Internal Test Softphone (Extension 100)
; ------------------------------------------------------------------------------
[100]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,gsm
auth=100
aors=100
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[100]
type=auth
auth_type=userpass
username=100
password=secretpassword123

[100]
type=aor
max_contacts=5
remove_existing=yes

; ------------------------------------------------------------------------------
; Inbound SIP Trunk Template
; ------------------------------------------------------------------------------
[trunk-endpoint]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
direct_media=no
aors=trunk-aor

[trunk-aor]
type=aor
contact=sip:your-sip-trunk-provider.com:5060
