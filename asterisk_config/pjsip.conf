; ==============================================================================
; Asterisk PJSIP Configuration for Softphones and Inbound SIP Trunks
; ==============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.1/32
external_media_address=172.24.134.15
external_signaling_address=172.24.134.15
external_signaling_port=5060
symmetric_transport=yes
allow_reload=yes

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=127.0.0.1/32
external_media_address=172.24.134.15
external_signaling_address=172.24.134.15
external_signaling_port=5060
symmetric_transport=yes
allow_reload=yes

; ------------------------------------------------------------------------------
; Internal Test Softphone (Extension 100)
; ------------------------------------------------------------------------------
[100]
type=endpoint
context=from-internal
transport=transport-tcp
disallow=all
allow=slin,ulaw,alaw,gsm
dtmf_mode=rfc4733
auth=100
aors=100
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
timers=no
timers_min_se=90
timers_sess_expires=1800
rtp_timeout=0
rtp_timeout_hold=0
media_address=172.24.134.15
bind_rtp_to_media_address=no

[100]
type=auth
auth_type=userpass
username=100
password=secretpassword123

[100]
type=aor
max_contacts=5
remove_existing=yes

; ------------------------------------------------------------------------------
; Internal Test Softphone (Extension 1000)
; ------------------------------------------------------------------------------
[1000]
type=endpoint
context=from-internal
transport=transport-tcp
disallow=all
allow=slin,ulaw,alaw,gsm
dtmf_mode=rfc4733
auth=1000
aors=1000
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
timers=no
timers_min_se=90
timers_sess_expires=1800
rtp_timeout=0
rtp_timeout_hold=0
media_address=172.24.134.15
bind_rtp_to_media_address=no

[1000]
type=auth
auth_type=userpass
username=1000
password=secretpassword123

[1000]
type=aor
max_contacts=5
remove_existing=yes

; ------------------------------------------------------------------------------
; Inbound SIP Trunk Template
; ------------------------------------------------------------------------------
[trunk-endpoint]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
direct_media=no
aors=trunk-aor

[trunk-aor]
type=aor
contact=sip:your-sip-trunk-provider.com:5060
