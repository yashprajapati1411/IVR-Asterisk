; ==============================================================================
; Asterisk PJSIP Configuration for Softphones and Inbound SIP Trunks
; ==============================================================================

[global]
type=global
user_agent=Asterisk PBX
default_realm=asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.31.0.0/16
local_net=127.0.0.1/32
external_media_address=15.252.238.8
external_signaling_address=15.252.238.8
external_signaling_port=5060
symmetric_transport=yes
allow_reload=yes

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=172.31.0.0/16
local_net=127.0.0.1/32
external_media_address=15.252.238.8
external_signaling_address=15.252.238.8
external_signaling_port=5060
symmetric_transport=yes
allow_reload=yes

; --- Transport for Carrier SIP Trunk (Port 5065 UDP) ---
[transport-udp-5065]
type=transport
protocol=udp
bind=0.0.0.0:5065
local_net=172.31.0.0/16
local_net=127.0.0.1/32
external_media_address=15.252.238.8
external_signaling_address=15.252.238.8
external_signaling_port=5065
symmetric_transport=yes
allow_reload=yes

; ------------------------------------------------------------------------------
; Internal Test Softphone (Extension 1000)
; ------------------------------------------------------------------------------
[1000]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,gsm,slin
dtmf_mode=rfc4733
auth=1000
inbound_auth=1000
aors=1000
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
media_address=15.252.238.8

[1000]
type=auth
auth_type=userpass
username=1000
password=secretpassword123

[1000]
type=aor
max_contacts=10
remove_existing=yes

; ------------------------------------------------------------------------------
; Internal Test Softphone (Extension 100)
; ------------------------------------------------------------------------------
[100]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,gsm,slin
dtmf_mode=rfc4733
auth=100
inbound_auth=100
aors=100
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
media_address=15.252.238.8

[100]
type=auth
auth_type=userpass
username=100
password=secretpassword123

[100]
type=aor
max_contacts=10
remove_existing=yes

; ------------------------------------------------------------------------------
; Inbound Carrier Peer-to-Peer SIP Trunk (203.57.85.154:5065)
; ------------------------------------------------------------------------------
[carrier-trunk]
type=endpoint
context=from-trunk
transport=transport-udp-5065
disallow=all
allow=alaw,ulaw,gsm
dtmf_mode=auto
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
aors=carrier-aor
media_address=15.252.238.8

[carrier-aor]
type=aor
contact=sip:203.57.85.154:5065

[carrier-identify]
type=identify
endpoint=carrier-trunk
match=203.57.85.154
